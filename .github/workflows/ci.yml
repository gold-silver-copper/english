name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Blocking: the full suite, including the extractor determinism/immutability tests
  # (extractor is now a default member, so `cargo test --workspace` exercises them).
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      # Examples are assert-based demos that `cargo test` never executes — run
      # them so stale key formats or API drift in examples fail CI, not users.
      - run: cargo run -p english --example test

  # Blocking: the dump-free determinism gate. Verifies (a) the lockfiles are
  # internally consistent, (b) no published key changed meaning vs the PR base
  # (merge-base), and (c) the committed PHF tables are exactly what the lockfiles
  # regenerate. None of this needs the multi-GB Wiktextract dump.
  registry:
    name: check-registry
    runs-on: ubuntu-latest
    # Cross-version immutability is ARMED: the checked-in lockfiles are the public
    # stability boundary, and any PR that moves/drops/revives a published key fails
    # here. The sanctioned way to renumber is `cargo xtask compact`, which bumps
    # data/assignments/DATA_MAJOR — check-registry waives cross-version immutability
    # for exactly that (visible, reviewable) bump. Never a silent data change.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so check-registry can resolve the merge-base
      - name: Fetch base branch
        if: github.base_ref != ''
        run: git fetch --no-tags --depth=2147483647 origin "${{ github.base_ref }}"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p xtask -- check-registry

  # fmt is BLOCKING (the tree is formatted; keep it that way). clippy remains
  # informational until a dedicated warning cleanup lands — flip it to blocking
  # then.
  lint:
    name: fmt (blocking) + clippy (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
        continue-on-error: true
